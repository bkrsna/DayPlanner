<!DOCTYPE html>
<html lang="en" class="h-full antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DayTrack • Personal Daily Goal Studio</title>
  <meta name="description" content="A distraction-free, local-first daily goal tracker, to-do list, and reflection studio.">
  <link rel="icon" href="favicon.ico">

  <!-- Preconnect and Google Fonts fallback for Geist & Geist Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script src="confetti.browser.js"></script>
</head>
<body class="min-h-full flex flex-col font-sans selection:bg-indigo-500/20 bg-[#f8f9fa] dark:bg-[#090a0d] text-zinc-900 dark:text-zinc-100 antialiased">
  <div id="app" class="min-h-screen flex flex-col">
    <!-- Main 3-Column Layout: Left (3 cols), Middle (6 cols), Right (3 cols) -->
    <main class="flex-1 max-w-[1520px] w-full mx-auto px-3 sm:px-4 lg:px-6 py-5 sm:py-6">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
        <!-- Left Column: Navigation, Streak, Backup, Theme, Search, View Switcher, Timeline -->
        <div id="left-column" class="lg:col-span-3 w-full lg:sticky lg:top-6 space-y-4"></div>

        <!-- Middle Column: To-Dos / Goals Section -->
        <div id="middle-column" class="lg:col-span-6 w-full"></div>

        <!-- Right Column: Stopwatch, World Cities & Journal -->
        <div id="right-column" class="lg:col-span-3 w-full lg:sticky lg:top-6 space-y-5"></div>
      </div>
    </main>

    <!-- Global Modals: Consistency & Streaks, Export & Import, Command Palette -->
    <div id="modals-root"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
